<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { margin-bottom: 5px; }
        nav a {
            margin-right: 20px;
            text-decoration: none;
            padding: 5px 10px;
            border-bottom: 2px solid transparent;
            color: black;
        }
        nav a.active { border-bottom: 2px solid #4f46e5; font-weight: normal; }
        table {
            border-collapse: collapse;
            margin: 20px 0;
            width: 100%;
        }
        th, td {
            border: 2px solid #000;
            padding: 6px 10px;
            text-align: center;
        }
        .table-title {
            font-weight: bold;
            font-size: 1.1em;
            background-color: #f8f8f8;
            border-bottom: 4px solid black;
        }
        .table-spacer {
            height: 12px;
            background-color: white;
            border: none;
        }
        .flex-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .flex-item {
            flex: 1 1 45%;  /* grow, shrink, base width */
            min-width: 300px;  /* triggers stacking on small screens */
        }

        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

<nav>
    <a href="#reads" class="active">Reads</a>
</nav>

<div id="reads" class="flex-container">
    <table class="flex-item">
        {% for lib in library_reads %}
        <tr>
        <th colspan="3" class="table-title">{{ lib.lib_name }} Reads</th>
        </tr>
        <tr>
            <th>Status</th>
            <th>Reads</th>
            <th>Percent</th>
        </tr>
        <tr><td>Barcode Pass</td><td>{{ lib.passing_reads }}</td><td>{{ lib.passing_perc }}</td></tr>
        <tr><td>Barcode Error</td><td>{{ lib.error_reads }}</td><td>{{ lib.error_perc }}</td></tr>
        {% endfor %}

    </table>
</div>

</body>
</html>
